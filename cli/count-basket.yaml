# Models to count. Open-weight rows use the Hugging Face tokenizer
# from models.dev. Closed labs use a count API. Add a models.dev id
# (or a bare SKU) per line.
#
#   npm run count:basket -- --cli-auth --out .cache/basket-counts.json
#   npm run count:basket -- --list
#   npm run count:basket -- --model anthropic/claude-mythos-5
#
# The site import matches these ids against models.dev and opens
# the model if it is not on the board yet.

models:
  - deepseek-v4-flash-0731
  - anthropic/claude-sonnet-4-6
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-4-7
  - anthropic/claude-opus-4-8
  - anthropic/claude-opus-5
  - anthropic/claude-fable-5
  - xai/grok-4.6
  - xai/grok-4.5
